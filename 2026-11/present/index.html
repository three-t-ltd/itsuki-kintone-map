    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(D.iv)}, key, u8(D.ct));
    sessionStorage.setItem(KEY, pw);
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }
  const form = document.getElementById("gate-form");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    try { await open(document.getElementById("gate-pw").value); }
    catch (_) { document.getElementById("gate-err").style.display = "block"; document.getElementById("gate-pw").value = ""; }
  });
  const saved = sessionStorage.getItem(KEY);
  if (saved) open(saved).catch(() => sessionStorage.removeItem(KEY));
})();
</script>
</body>
